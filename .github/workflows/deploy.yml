name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: [self-hosted, fmknode]  # Pin deploys to fmknode, where /opt/coinflip exists
    
    # Set working directory to the main deployment location
    defaults:
      run:
        working-directory: /opt/coinflip
    
    steps:
      - name: Pull latest changes
        run: |
          git remote set-url origin https://github.com/famake3/coinflip.git
          git fetch origin
          git reset --hard origin/main
          
      - name: Set permissions
        run: chmod +x deploy.sh
        
      - name: Run deployment script
        run: ./deploy.sh
        
      - name: Verify containers are running
        run: |
          echo "📊 Final status check..."
          docker compose ps
          
          # One more verification that the app is accessible
          if curl -f http://localhost:80 > /dev/null 2>&1; then
            echo "✅ Deployment verified - application is accessible!"
          else
            echo "⚠️  Warning: Application may not be accessible on port 80"
            echo "This is expected if SWAG is proxying all traffic"
          fi
          
      - name: Notification
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment succeeded at $(date)"
          else
            echo "❌ Deployment failed at $(date)"
          fi
